name: Release installer
on: {push: {tags: ['v*']}, workflow_dispatch: {}}
permissions: {contents: write}
jobs: {release: {runs-on: windows-latest, steps: [{uses: actions/checkout@v5}, {uses: actions/setup-node@v5, with: {node-version: 20}}, {run: npm install}, {run: npm run release, env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}}]}}
