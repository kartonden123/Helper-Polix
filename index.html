<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polix Helper</title>
<style>
:root{--acc-rgb:255,77,109;--text:#f4f1f5;--muted:#8d8593;--faint:#5d5663;--line:rgba(255,255,255,.08);--accent:#ff4d6d;--glass:linear-gradient(180deg,#221f27 0%,#16141a 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--text);font:14px/1.45 "Segoe UI",Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
#ui{animation:uiIn .22s ease-out both;width:100%;padding:36px 30px 44px;display:flex;flex-direction:column}
.tab{align-self:center;display:flex;gap:6px;align-items:center;background:var(--solid,#1d1a20);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:4px 14px;font-size:12px;color:var(--muted);margin-bottom:-1px;position:relative;z-index:1;animation:fade .5s both}
.tab b{color:var(--accent)}
.brand{position:absolute;top:10px;left:26px;font-weight:800;font-size:13px;letter-spacing:.02em;animation:fade .5s both}
.by{pointer-events:none;position:absolute;top:12px;right:26px;font-size:11px;color:var(--muted);letter-spacing:.06em;animation:fade .5s both}
.by b{color:var(--accent);font-weight:800}
#ui{position:relative}
.bar{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:12px 12px 12px 16px;box-shadow:0 10px 28px -10px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);transition:border-color .25s,box-shadow .25s;animation:drop .45s cubic-bezier(.2,.8,.2,1) both;-webkit-app-region:drag}
.bar>*{-webkit-app-region:no-drag}
.bar:focus-within{border-color:rgba(var(--acc-rgb),.5);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.3),0 10px 28px -10px rgba(0,0,0,.55)}
.logo{width:26px;height:26px;flex:none;-webkit-app-region:drag}
#q{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:19px;user-select:text}
#q::placeholder{color:#6f6876}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;position:relative}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .2s}
.seg button.on{color:#fff;background:rgba(255,255,255,.14)}
.ib{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;transition:.2s}
.ib:hover,.ib.on{color:#fff;border-color:rgba(var(--acc-rgb),.5);background:var(--accent-soft,rgba(var(--acc-rgb),.14))}
.panel{margin-top:8px;background:var(--glass);border:1px solid rgba(255,255,255,.1);border-radius:20px;overflow:hidden;display:none;flex-direction:column;min-height:0;box-shadow:0 10px 28px -10px rgba(0,0,0,.55);animation:drop .3s cubic-bezier(.2,.8,.2,1) both}
.panel.on{display:flex}
.cols{display:flex;min-height:0}.cols>#list{flex:1;min-width:0}
#res{display:none;flex:none;width:340px;border-right:1px solid var(--line)}
.panel.split #res{display:block}
.panel.split #res .row{grid-template-columns:50px 1fr;padding:8px 10px;gap:10px}.panel.split #res .row .meta{display:none}.panel.split #res .name{font-size:12.5px}
#res .snip.cur{background:rgba(var(--acc-rgb),.14)}
.scroll{overflow-y:auto;min-height:0;padding:6px;max-height:var(--maxh,520px)}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:10px 12px 4px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:10px 14px;margin:2px 0;border-radius:14px;border:1px solid transparent;cursor:pointer;transition:background .15s;animation:fade .25s both}
.row:hover{background:rgba(255,255,255,.05)}
.row.sel{background:linear-gradient(90deg,rgba(var(--acc-rgb),.16),rgba(var(--acc-rgb),.04));border-color:rgba(var(--acc-rgb),.35)}
.code{font-weight:800;font-size:16px;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.code i{font-style:normal;font-size:9.5px;color:#cfc8d3;font-weight:700;letter-spacing:.06em;background:rgba(255,255,255,.09);border-radius:5px;padding:1px 6px;align-self:flex-start}
.name{font-size:13.5px;color:#e6e1e9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.name small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill{border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:rgba(255,255,255,.08);color:#d9d3dd}
.pill.w{background:rgba(255,196,60,.14);color:#ffd36b}
.pill.w4{background:rgba(255,59,59,.16);color:#ff8a8a}
.rec{color:#ff7b7b;font-weight:700;font-size:10.5px;letter-spacing:.05em}
mark{background:rgba(var(--acc-rgb),.28);color:#fff;border-radius:3px;padding:0 1px}
.snip{padding:9px 12px;border-radius:12px;cursor:pointer;animation:fade .25s both}
.snip:hover{background:rgba(255,255,255,.07)}
.snip small{color:var(--accent);font-size:11px;display:block;margin-bottom:2px}
.snip p{margin:0;font-size:13px;color:#d6d0da;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:26px;text-align:center;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.chip{background:rgba(255,255,255,.07);border:1px solid var(--line);color:#ddd6e0;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.2s}
.chip:hover{border-color:rgba(var(--acc-rgb),.5);color:#fff}
.det{padding:16px 18px 18px;overflow-y:auto;user-select:text;animation:fade .25s both}
.det h2{margin:0 0 2px;font-size:20px}
.det h2 span{color:var(--muted);font-weight:500;font-size:14px}
.det .t{color:#cfc8d3;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stats div{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stats small{display:block;color:var(--muted);font-size:11px}
.stats b{font-size:14px}
.note{border-radius:10px;padding:8px 12px;margin-bottom:12px;background:rgba(255,255,255,.06);font-size:13px}
.note.r{background:rgba(255,59,59,.14);color:#ff9d9d}
.note.s{background:rgba(255,200,80,.12);color:#ffd98a}
.txt{white-space:pre-wrap;color:#ddd7e0;font-size:13.5px}
.hl{color:#ffb3c1;font-weight:600}
.back{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;padding:10px 18px 0;text-align:left}
.back:hover{color:#fff}
.imm{display:grid;gap:6px;margin-bottom:14px}
.imm div{background:rgba(255,255,255,.06);border-radius:10px;padding:7px 12px;font-size:13px}
.arts{display:flex;flex-wrap:wrap;gap:6px}
.arts b{background:rgba(var(--acc-rgb),.14);border:1px solid rgba(var(--acc-rgb),.35);border-radius:8px;padding:3px 10px;cursor:pointer;font-size:13px}
.memo h3{margin:14px 0 4px;font-size:13px;color:var(--accent);letter-spacing:.04em}
.memo p{margin:0 0 4px;font-size:13px;color:#d6d0da}
.adm-top{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.adm-top div{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.adm-top small{display:block;color:var(--muted);font-size:11px}
.adm-top b{font-size:22px}
.adm-row{display:grid;grid-template-columns:12px 1fr auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:10px}
.adm-row:nth-child(odd){background:rgba(255,255,255,.04)}
.dot{width:9px;height:9px;border-radius:50%;background:#555}
.dot.on{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
.adm-row small{color:var(--muted);font-size:11.5px;white-space:nowrap}
.foot{padding:8px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint);display:flex;gap:14px}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes uiIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="ui">
  
  <div class="tab" id="tabhint">Alt+Q — показать / скрыть · <b>Esc</b> — назад</div>
  <div class="bar" id="bar">
    <img class="logo" src="logo.png" alt="">
    <input id="q" placeholder="" autocomplete="off" spellcheck="false">
    <div class="seg" id="seg"><button data-d="rules">Правила</button><button data-d="law" class="on">Законы</button></div>
    <button class="ib" id="admBtn" title="Админ-панель" style="display:none">👑</button>
    <button class="ib" id="immBtn" title="Неприкосновенные лица">🛡</button>
    <button class="ib" id="memoBtn" title="Памятка">📖</button>
    <button class="ib" id="hideBtn" title="Скрыть (Alt+Q)">✕</button>
  </div>
  <div class="panel" id="panel">
    <div class="cols"><div class="scroll" id="res"></div><div class="scroll" id="list"></div></div>
    <div class="foot"><span>↑↓ выбор</span><span>Enter открыть</span><span>Esc назад</span><span id="cnt" style="margin-left:auto"></span></div>
  </div>
</div>
<script src="data.js"></script>
<script src="ak.js"></script>
<script src="rules.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/ё/g,'е');
const hl=t=>esc(t).replace(/(\d[\d.,]*\d|\d)(\s?\$|\s?месяц\w*|\s?дн\w*|\s?мин\w*)?/g,m=>`<span class="hl">${m}</span>`);
const stars=w=>w?'⭐'.repeat(w):'';
const shortCode=a=>a.code.replace(/^(ДК|АК) /,'');
const IDX=ITEMS.map(a=>({a,code:norm(a.code.replace(/^(ДК|АК) /,'')),title:norm((a.title||'')+' '+(a.codeTitle||'')),text:norm(a.text)}));
const ENT=[];DOCS.forEach(d=>d.paras.forEach(p=>{if(p.length>25)ENT.push({d,p,n:norm(p)});}));

let doc='law',view='home',results=[],sel=0,last=null;
const panel=$('#panel'),list=$('#list'),q=$('#q');

function mark(text,words){
  let t=esc(text);
  words.forEach(w=>{if(w.length<2)return;t=t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),s=>`<mark>${s}</mark>`);});
  return t;
}
const ALIAS={'пго':'Правила государственных','осн':'Основные правила','основные':'Основные правила','пп':'Основные правила','ук':'Уголовный','дк':'Дорожный','ак':'Административный','пк':'Процессуальный','тк':'Трудовой','кэ':'Кодекс этики','лспд':'LSPD','lspd':'LSPD','фиб':'FIB','fib':'FIB','шериф':'Sheriff','шерифф':'Sheriff','lscsd':'Sheriff','sheriff':'Sheriff','санг':'San-Andreas','sang':'San-Andreas','ems':'EMS','ву':'устав','устав':'устав','уставы':'устав','government':'Government','правительство':'Government','weazel':'Weazel','визел':'Weazel','емс':'EMS','прокуратура':'Прокуратуры','военное':'военного','ограбления':'ограблений','банки':'банков','бизнесы':'бизнесов','семьи':'семейных'};
const ALIAS_SEG={'ук':1,'дк':1,'ак':1};
const CATTAB=c=>(c==='rules'||c==='org')?'rules':'law';
function search(raw){
  let s=norm(raw.trim());if(!s)return{items:[],snips:[],words:[]};
  const tk=s.split(/\s+/);let dn=null,aliasTok=null;const nums=[],rest=[];
  for(let t of tk){
    t=t.replace(/^(п|ст|пп)\.?(?=\d)/,'');
    if(/^(п|пункт|ст|статья)\.?$/.test(t)&&tk.length>1)continue;
    if(ALIAS[t]&&!dn){dn=ALIAS[t];aliasTok=t;}
    else if(/^\d+(\.\d+)+\.?$/.test(t)||(/^\d+$/.test(t)&&tk.length>1))nums.push(t.replace(/\.$/,''));
    else rest.push(t);
  }
  const wd=a=>a.map(w=>/^[\d.]+$/.test(w)||w.length<5?w:w.slice(0,w.length-2));
  let segDoc=null;
  if(dn){
    const dnl=dn.toLowerCase();const hit=e=>e.d.name.toLowerCase().indexOf(dnl)>=0;
    const seg=ALIAS_SEG[aliasTok]?aliasTok.toUpperCase():null;
    if(nums.length){
      const res=new RegExp('^'+nums[0].replace(/\./g,'\\.')+'(?![\\d])');
      const pin=ENT.filter(e=>hit(e)&&res.test(e.p));
      let items=[];
      if(seg)items=IDX.filter(e=>e.a.doc===seg&&e.code===nums[0]).map(e=>e.a);
      if(pin.length||items.length)return{items,snips:pin.slice(0,8),words:[],tab:items.length?'law':CATTAB(pin[0].d.cat)};
    }else if(!seg){
      const ws=wd(rest);
      const sn=ENT.filter(e=>hit(e)&&ws.every(w=>e.n.includes(w))).slice(0,rest.length?14:30);
      if(sn.length)return{items:[],snips:sn,words:ws,tab:CATTAB(sn[0].d.cat)};
    }else{segDoc=seg;s=rest.join(' ');if(!s)return{items:[],snips:[],words:[],tab:'law'};}
  }
  const words=wd(s.split(/\s+/).filter(Boolean));
  const isNum=/^[\d.]+$/.test(s);
  const tab=segDoc?'law':doc;
  const items=[];
  if(tab==='law')for(const e of IDX){
    if(segDoc&&e.a.doc!==segDoc)continue;
    let sc=0;
    if(isNum){if(e.code===s)sc=100;else if(e.code.startsWith(s))sc=60-Math.min(e.code.length,30);else continue;}
    else{
      if(!words.every(w=>e.code.startsWith(w)||e.title.includes(w)||e.text.includes(w)))continue;
      sc=words.reduce((n,w)=>n+(e.title.includes(w)?5:1)+(e.code.startsWith(w)?20:0),0);
    }
    items.push({a:e.a,sc});
  }
  items.sort((x,y)=>y.sc-x.sc);
  const snips=[];const cnt={};
  if(!isNum&&s.length>=3){
    const segName=segDoc==='ДК'?'Дорожный':segDoc==='УК'?'Уголовный':segDoc==='АК'?'Административный':null;
    for(const e of ENT){
      if(CATTAB(e.d.cat)!==tab)continue;
      if(segName&&e.d.name.indexOf(segName)<0)continue;
      if(words.every(w=>e.n.includes(w))){const c=(cnt[e.d.name]||0);if(c<3){cnt[e.d.name]=c+1;snips.push(e);if(snips.length>=14)break;}}
    }
  }
  return{items:items.slice(0,40).map(x=>x.a),snips,words};
}function row(a,i,words){
  const t=a.title||a.codeTitle||'';
  const m=a.wanted?`<span class="pill w${a.wanted>=4?' w4':''}">${stars(a.wanted)}</span><span>${a.prison?a.prison+' мес.':''}${a.record?' <span class="rec">СУДИМОСТЬ</span>':''}</span>`:(a.fine?'<span class="pill">до $'+esc(a.fine.replace(/\D/g,''))+'</span>':'');
  const imm=IMMUNE_ARTS.includes(a.code)?'<small>🛡 неприкосновенного можно задержать</small>':'';
  return `<div class="row${i===sel?' sel':''}" data-i="${i}" style="animation-delay:${Math.min(i,10)*18}ms"><div class="code">${esc(shortCode(a))}<i>${a.doc}</i></div><div class="name">${mark(t,words)}${imm}</div><div class="meta">${m}</div></div>`;
}
function render(){
  panel.classList.add('on');
  const v=q.value;
  if(view==='art'){return;}
  if(view==='imm'||view==='memo')return;
  if(!v.trim()){
    view='home';results=[];
    list.innerHTML=`<div class="chips"><span class="chip" data-k="imm">🛡 Неприкосновенные</span><span class="chip" data-k="memo">📖 Памятка</span><span class="chip" data-q="4+">⭐4–5 судимость</span><span class="chip" data-q="убийство">убийство</span><span class="chip" data-q="оружие">оружие</span><span class="chip" data-q="наркот">наркотики</span><span class="chip" data-q="задержание">задержание</span></div>${doc==='rules'?'<div class="sec">Документы</div><div class="chips">'+[['пго','ПГО'],['осн','Основные правила'],['лспд','LSPD'],['шериф','Sheriff'],['фиб','FIB'],['санг','SANG'],['ems','EMS'],['военное','Военное положение'],['ограбления','Ограбления'],['банки','Банки'],['бизнесы','Бизнесы'],['семьи','Семьи']].map(x=>`<span class="chip" data-q="${x[0]}">${x[1]}</span>`).join('')+'</div>':'<div class="sec">Кодексы</div><div class="chips">'+[['пк','Процессуальный'],['тк','Трудовой'],['кэ','Этика'],['ук','УК'],['дк','ДК'],['ак','АК']].map(x=>`<span class="chip" data-q="${x[0]}">${x[1]}</span>`).join('')+'</div><div class="empty"></div>'}`;
    $('#cnt').textContent=`${ITEMS.length} статей`;
    return;
  }
  let r=search(v);if(r.tab&&r.tab!==doc)setDoc(r.tab);
  if(!r.items.length&&!r.snips.length&&!r.tab){const keep=doc;doc=keep==='law'?'rules':'law';const r2=search(v);if(r2.items.length||r2.snips.length){setDoc(doc);r=r2;}else doc=keep;}   // в этой вкладке пусто, в соседней есть
  last=r;
  results=r.items;if(sel>=results.length)sel=0;
  let h='';
  if(results.length)h+='<div class="sec">Статьи</div>'+results.map((a,i)=>row(a,i,r.words)).join('');
  if(r.snips.length)h+='<div class="sec">В кодексах и уставах</div>'+r.snips.map((e,i)=>`<div class="snip" data-s="${i}"><small>${esc(e.d.name)}</small><p>${mark(e.p,r.words)}</p></div>`).join('');
  list.innerHTML=h||'<div class="empty">Ничего не найдено</div>';
  $('#cnt').textContent=results.length?`${results.length} статей`:'';
}
function backBtn(){return '<button class="back" id="bk">← назад (Esc)</button>';}
function openArt(a){
  view='art';
  const note=a.doc==='УК'?(a.record?'<div class="note r">Судимость: да. Розыск 4 и выше даёт запись о судимости.</div>':`<div class="note">Судимость: нет (розыск ${a.wanted||'—'}).</div>`):'';
  const imm=IMMUNE_ARTS.includes(a.code)?'<div class="note s">🛡 По этой статье неприкосновенность снимается: лицо можно задержать.</div>':'';
  panel.classList.add('on');
  list.innerHTML=backBtn()+`<div class="det"><h2>${a.doc==='УК'?'Статья':a.doc} ${esc(shortCode(a))}${a.flags?' <span>('+esc(a.flags)+')</span>':''}</h2><p class="t">${esc(a.title||a.codeTitle||'')}</p>
  <div class="stats"><div><small>Розыск</small><b>${a.wanted?stars(a.wanted):'—'}</b></div><div><small>Тюрьма</small><b>${a.prison?a.prison+' мес.':'—'}</b></div><div><small>Залог</small><b>${a.wanted?BAIL[a.wanted]:'—'}</b></div><div><small>Штраф</small><b>${a.fine?'до $'+esc(a.fine.replace(/\D/g,'')):'—'}</b></div></div>
  ${note}${imm}<div class="txt">${hl(a.text||'Текст не загружен')}</div></div>`;
  $('#bk').onclick=goBack;$('#cnt').textContent='';
}
function openSnip(e){
  view='art';
  list.innerHTML=backBtn()+`<div class="det"><h2><span>${esc(e.d.name)}</span></h2><div class="txt" style="margin-top:10px">${hl(e.p)}</div></div>`;
  $('#bk').onclick=goBack;
}
function openImm(){
  view='imm';panel.classList.add('on');
  list.innerHTML=backBtn()+`<div class="det"><h2>🛡 Неприкосновенные лица</h2><p class="t">Обычно не задерживаются. По статьям ниже задержание возможно.</p><div class="imm">${IMMUNE_LIST.map(t=>`<div>${esc(t)}</div>`).join('')}</div><div class="sec" style="padding-left:0">Можно задержать по статьям</div><div class="arts">${IMMUNE_ARTS.map(c=>`<b data-c="${c}">${c}</b>`).join('')}</div></div>`;
  $('#bk').onclick=goBack;
  list.querySelectorAll('.arts b').forEach(b=>b.onclick=()=>{const a=ITEMS.find(x=>x.code===b.dataset.c);if(a){view='art';prev='imm';openArt(a);}});
  $('#cnt').textContent='';
}
function openMemo(){
  view='memo';panel.classList.add('on');
  const isHead=s=>s.length>3&&/[А-ЯЁ]/.test(s)&&!/[а-яё]/.test(s);
  let h='';DATA.general.forEach(s=>{h+=isHead(s)?`<h3>${esc(s)}</h3>`:`<p>${esc(s)}</p>`;});
  list.innerHTML=backBtn()+`<div class="det memo">${h}</div>`;
  $('#bk').onclick=goBack;$('#cnt').textContent='';
}
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000|0);if(s<90)return 'сейчас';if(s<3600)return (s/60|0)+' мин назад';if(s<86400)return (s/3600|0)+' ч назад';return (s/86400|0)+' дн назад';}
async function openAdmin(){
  view='memo';panel.classList.add('on');
  list.innerHTML=backBtn()+'<div class="det"><h2>👑 Кто пользуется</h2><p class="t">Загрузка…</p></div>';
  $('#bk').onclick=goBack;$('#cnt').textContent='';
  const d=await window.overlay.adminUsers();
  if(!d||d.error){list.innerHTML=backBtn()+`<div class="det"><h2>👑 Кто пользуется</h2><p class="t">${esc(d&&d.error||'Ошибка')}</p></div>`;$('#bk').onclick=goBack;return;}
  list.innerHTML=backBtn()+`<div class="det"><h2>👑 Кто пользуется</h2>
  <div class="adm-top"><div><small>Всего</small><b>${d.total}</b></div><div><small>В сети</small><b style="color:#3ddc84">${d.online}</b></div><div><small>За 24 часа</small><b>${d.day}</b></div><div><small>За 7 дней</small><b>${d.week}</b></div></div>
  ${d.users.map(u=>`<div class="adm-row"><span class="dot${u.online?' on':''}"></span><span>${esc(u.name)}<br><small>${esc(u.id)}</small></span><small>v${esc(u.version||'?')}</small><small>${ago(u.last_seen)}</small></div>`).join('')||'<p class="t">Пока никого.</p>'}</div>`;
  $('#bk').onclick=goBack;
}
if(window.overlay&&window.overlay.authState)window.overlay.authState().then(s=>{if(s&&s.admin){const b=$('#admBtn');b.style.display='';b.onclick=openAdmin;}});
let prev=null;
function goBack(){
  if(view==='art'&&prev==='imm'){prev=null;openImm();return;}
  view='home';prev=null;render();
}
function clickRows(e){
  const r=e.target.closest('.row');if(r){openArt(results[+r.dataset.i]);return;}
  const s=e.target.closest('.snip');if(s){openSnip(last.snips[+s.dataset.s]);return;}
  const c=e.target.closest('.chip');if(c){
    if(c.dataset.k==='imm')openImm();else if(c.dataset.k==='memo')openMemo();
    else if(c.dataset.q==='4+'){q.value='';showRecord();}else{q.value=c.dataset.q;render();q.focus();}
  }
}
function showRecord(){
  view='home';panel.classList.add('on');
  const arr=ITEMS.filter(a=>a.record);
  results=arr;last={items:arr,snips:[],words:[]};sel=0;
  list.innerHTML='<div class="sec">Розыск 4–5, судимость</div>'+arr.map((a,i)=>row(a,i,[])).join('');
  $('#cnt').textContent=arr.length+' статей';
}
list.addEventListener('click',clickRows);
q.addEventListener('input',()=>{view='home';sel=0;render();});
function setDoc(d){doc=d;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x.dataset.d===d));}
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setDoc(b.dataset.d);view='home';prev=null;sel=0;render();q.focus();});
const _i=$('#immBtn'),_m=$('#memoBtn');if(_i)_i.onclick=openImm;if(_m)_m.onclick=openMemo;
$('#hideBtn').onclick=()=>window.overlay&&window.overlay.hide&&window.overlay.hide();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(view!=='home')goBack();
    else if(q.value){q.value='';sel=0;render();}
    else window.overlay&&window.overlay.hide&&window.overlay.hide();
    return;
  }
  if(view==='home'&&results.length){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+results.length)%results.length;
      list.querySelectorAll('.row').forEach((r,i)=>r.classList.toggle('sel',i===sel));
      const el=list.querySelector('.row.sel');if(el)el.scrollIntoView({block:'nearest'});
    }
    if(e.key==='Enter'){e.preventDefault();openArt(results[sel]);}
  }
  if(e.key==='Backspace'&&view!=='home'&&document.activeElement!==q){goBack();}
});
if(window.overlay&&window.overlay.onShow)window.overlay.onShow(()=>{view='home';sel=0;render();const ui=$('#ui');ui.style.animation='none';ui.offsetHeight;ui.style.animation='';q.focus();q.select();requestAnimationFrame(()=>requestAnimationFrame(()=>{if(window.overlay.ready)window.overlay.ready();}));});

/* окно подгоняется под размер меню, поэтому пустого прозрачного места нет */
document.documentElement.style.setProperty('--maxh',Math.round(screen.availHeight*0.55)+'px');
if(window.overlay&&window.overlay.resize){
  const ui=document.getElementById('ui');let lastH=0;
  const fit=()=>{const h=Math.ceil(ui.getBoundingClientRect().height);if(h&&Math.abs(h-lastH)>1){lastH=h;window.overlay.resize(h);}};
  new ResizeObserver(fit).observe(ui);fit();
}render();q.focus();
</script>
